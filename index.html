<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>LIFELOG — Your Life. Your Progress.</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg-primary: #09090b;
      --bg-secondary: #121216;
      --bg-card: #18181d;
      --bg-elevated: #222229;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.14);
    }

    html[data-theme="oled"] {
      --bg-primary: #000000;
      --bg-secondary: #08080a;
      --bg-card: #101014;
      --bg-elevated: #1a1a20;
    }

    html[data-theme="light"] {
      --bg-primary: #f5f5f7;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-elevated: #f0f0f3;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --text-primary: #18181b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.1);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Inter", sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
    }

    .card-elevated {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
    }

    .input-base {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-base:focus {
      border-color: var(--accent);
    }

    .btn-tap {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      font-weight: 500;
      transition: transform 0.1s ease, opacity 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
      user-select: none;
    }

    .btn-tap:active {
      transform: scale(0.97);
    }

    .nav-glass {
      background-color: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
    }

    html[data-theme="light"] .nav-glass {
      background-color: rgba(255, 255, 255, 0.88);
    }

    .header-glass {
      background-color: rgba(9, 9, 11, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-subtle);
    }

    html[data-theme="light"] .header-glass {
      background-color: rgba(245, 245, 247, 0.85);
    }

    .pb-safe {
      padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
    }

    .bottom-nav-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-500/30">

  <!-- Top Header -->
  <header class="header-glass sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-7 h-7 rounded-lg bg-blue-500/15 border border-blue-500/30 flex items-center justify-center text-blue-400">
          <i data-lucide="activity" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="font-semibold tracking-tight text-base">LIFELOG</span>
          <span class="hidden sm:inline-block text-xs ml-2" style="color: var(--text-muted)">Your Life. Your Progress.</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Active Timer Mini Pill -->
        <button id="header-timer-pill" class="hidden items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-500/15 border border-blue-500/30 text-blue-400 tabular-nums" onclick="switchTab('record'); setRecordSubTab('timer');">
          <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse-subtle"></span>
          <span id="header-timer-text">00:00</span>
        </button>

        <!-- Demo badge if demo data exists -->
        <span id="demo-mode-badge" class="hidden px-2.5 py-1 rounded-full text-[11px] font-medium bg-amber-500/15 text-amber-400 border border-amber-500/30">
          DEMOデータ含
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 pt-4 pb-safe">
    <div id="app-view"></div>
  </main>

  <!-- Bottom Navigation (5 Screens) -->
  <nav class="nav-glass fixed bottom-0 left-0 right-0 z-40 bottom-nav-safe">
    <div class="max-w-5xl mx-auto grid grid-cols-5 h-16">
      <button class="nav-btn flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors" data-tab="home" onclick="switchTab('home')">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span>HOME</span>
      </button>
      <button class="nav-btn flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors" data-tab="record" onclick="switchTab('record')">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span>RECORD</span>
      </button>
      <button class="nav-btn flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors" data-tab="analytics" onclick="switchTab('analytics')">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span>ANALYTICS</span>
      </button>
      <button class="nav-btn flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors" data-tab="calendar" onclick="switchTab('calendar')">
        <i data-lucide="calendar-days" class="w-5 h-5"></i>
        <span>CALENDAR</span>
      </button>
      <button class="nav-btn flex flex-col items-center justify-center gap-1 text-[11px] font-medium transition-colors" data-tab="settings" onclick="switchTab('settings')">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span>SETTINGS</span>
      </button>
    </div>
  </nav>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-panel" class="w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-[90dvh] overflow-y-auto" style="background-color: var(--bg-card); border: 1px solid var(--border-strong);">
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-sm pointer-events-none"></div>

  <script>
    // ==========================================
    // 1. CONSTANTS & STORAGE KEYS
    // ==========================================
    const STORAGE_KEY = 'lifelog_app_data_v1';
    const TIMER_KEY = 'lifelog_active_timer_v1';

    const CATEGORY_META = {
      BODY:      { label: 'BODY',      jp: '身体・健康',   color: '#10b981', bg: 'rgba(16, 185, 129, 0.15)', icon: 'heart-pulse' },
      STUDY:     { label: 'STUDY',     jp: '勉強',         color: '#3b82f6', bg: 'rgba(59, 130, 246, 0.15)', icon: 'book-open' },
      CREATE:    { label: 'CREATE',    jp: 'AI・制作',     color: '#06b6d4', bg: 'rgba(6, 182, 212, 0.15)',  icon: 'cpu' },
      KNOWLEDGE: { label: 'KNOWLEDGE', jp: '読書・知識',   color: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.15)', icon: 'library' },
      LIFE:      { label: 'LIFE',      jp: '生活・習慣',   color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.15)', icon: 'home' },
      OTHER:     { label: 'OTHER',     jp: 'その他',       color: '#ec4899', bg: 'rgba(236, 72, 153, 0.15)', icon: 'sparkles' }
    };

    const PRECISION_META = {
      measured:    { label: '実測',   desc: 'タイマー計測',         color: '#3b82f6', bg: 'rgba(59, 130, 246, 0.16)' },
      manual:      { label: '手入力', desc: '時計等で確認して入力', color: '#10b981', bg: 'rgba(16, 185, 129, 0.16)' },
      approx:      { label: '概算',   desc: 'おおよその時間',       color: '#f59e0b', bg: 'rgba(245, 158, 11, 0.16)' },
      unconfirmed: { label: '未確認', desc: '活動したか不明',       color: '#71717a', bg: 'rgba(113, 113, 122, 0.2)' }
    };

    function getDefaultData() {
      return {
        version: 1,
        settings: {
          heightCm: 180,
          startWeightKg: 85.2,
          targetWeightKg: 75.0,
          theme: 'dark',
          assistEnabled: true,
          assistTime: '21:00',
          browserNotify: false
        },
        categories: {
          BODY: ['体重', '体脂肪率', '運動', '睡眠時間', '体調メモ'],
          STUDY: ['数学', '英語', '物理', '化学', '国語', '情報', 'その他'],
          CREATE: ['AI開発', 'プログラミング', 'アプリ開発', 'ブログ執筆', 'ビジネス研究', 'その他'],
          KNOWLEDGE: ['読書', '新聞', 'オンライン学習', 'その他'],
          LIFE: ['掃除', '家事', '整理整頓', '生活習慣', 'その他'],
          OTHER: ['外出', '人との交流', '自由記録']
        },
        exerciseMenu: ['ランニング', 'ウォーキング', '筋トレ', 'スクワット', '腕立て伏せ', 'プランク', 'ストレッチ', 'その他'],
        habits: [
          { id: 'h_water', name: '朝の水分補給', active: true },
          { id: 'h_english', name: '英語に触れる', active: true },
          { id: 'h_move', name: '少しでも体を動かす', active: true },
          { id: 'h_read', name: '読書 10分以上', active: true },
          { id: 'h_sleep', name: '日付が変わる前に寝る準備', active: true }
        ],
        activities: [],
        weights: [],
        habitLogs: {},
        confirmedRestDays: {},
        assistDismissedDates: {}
      };
    }

    function getDefaultTimer() {
      return {
        sessionId: null,
        status: 'idle', // 'idle' | 'running' | 'paused'
        mode: '25',     // '25' | '50' | 'free'
        targetSec: 25 * 60,
        category: 'STUDY',
        item: '英語',
        memo: '',
        accumulatedMs: 0,
        lastStartedAt: null
      };
    }

    // ==========================================
    // 2. SAFE STORAGE & DATE HELPERS
    // ==========================================
    function safeLoad(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    }

    function safeSave(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        return false;
      }
    }

    function toLocalDateStr(d = new Date()) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function toLocalDateTimeStr(d = new Date()) {
      const datePart = toLocalDateStr(d);
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${datePart}T${hh}:${mm}`;
    }

    function addDays(dateStr, delta) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d + delta);
      return toLocalDateStr(dt);
    }

    function formatJapaneseDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return `${y}年${m}月${d}日 (${weekdays[dt.getDay()]})`;
    }

    function formatMinutes(mins) {
      if (mins === null || mins === undefined) return '未記録';
      if (mins < 60) return `${mins}分`;
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return m === 0 ? `${h}時間` : `${h}時間${m}分`;
    }

    function formatTimerClock(totalSec) {
      const s = Math.max(0, Math.floor(totalSec));
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function genId(prefix = 'id') {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ==========================================
    // 3. APP STATE
    // ==========================================
    let appData = Object.assign(getDefaultData(), safeLoad(STORAGE_KEY, {}));
    // Ensure nested defaults exist
    appData.settings = Object.assign(getDefaultData().settings, appData.settings || {});
    appData.categories = Object.assign(getDefaultData().categories, appData.categories || {});
    if (!Array.isArray(appData.exerciseMenu)) appData.exerciseMenu = getDefaultData().exerciseMenu;
    if (!Array.isArray(appData.habits)) appData.habits = getDefaultData().habits;
    if (!Array.isArray(appData.activities)) appData.activities = [];
    if (!Array.isArray(appData.weights)) appData.weights = [];
    if (!appData.habitLogs) appData.habitLogs = {};
    if (!appData.confirmedRestDays) appData.confirmedRestDays = {};
    if (!appData.assistDismissedDates) appData.assistDismissedDates = {};

    let timerState = Object.assign(getDefaultTimer(), safeLoad(TIMER_KEY, {}));
    let timerInterval = null;
    let isSavingLock = false;

    let currentTab = 'home';
    let recordSubTab = 'timer'; // 'timer' | 'manual' | 'weight' | 'exercise' | 'habits'
    let analyticsPeriod = 'week'; // 'week' | 'month' | 'quarter' | 'year' | 'custom'
    let analyticsPrecisionFilter = 'all'; // 'all' | 'measured' | 'manual' | 'approx'
    let analyticsCustomStart = addDays(toLocalDateStr(), -13);
    let analyticsCustomEnd = toLocalDateStr();
    let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    let selectedCalendarDate = toLocalDateStr();

    let chartInstances = {};

    function persistData() {
      safeSave(STORAGE_KEY, appData);
      updateDemoBadge();
    }

    function persistTimer() {
      safeSave(TIMER_KEY, timerState);
    }

    function applyTheme() {
      const theme = appData.settings.theme || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    }

    function updateDemoBadge() {
      const hasDemo = appData.activities.some(a => a.isDemo) || appData.weights.some(w => w.isDemo);
      const badge = document.getElementById('demo-mode-badge');
      if (badge) {
        badge.classList.toggle('hidden', !hasDemo);
      }
    }

    // ==========================================
    // 4. TOAST & MODAL SYSTEM (NO alert/confirm)
    // ==========================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-rose-500/95 text-white border-rose-400/40'
        : type === 'info'
          ? 'bg-blue-600/95 text-white border-blue-400/40'
          : 'bg-emerald-600/95 text-white border-emerald-400/40';
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border text-sm font-medium shadow-xl flex items-center justify-between gap-2 transition-all duration-200 ${colors}`;
      el.innerHTML = `<span>${escHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 200);
      }, 2600);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-content').innerHTML = '';
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // ==========================================
    // 5. TIMER ENGINE (Pause-safe & Reload-safe)
    // ==========================================
    function getTimerElapsedMs() {
      if (timerState.status === 'running' && timerState.lastStartedAt) {
        return timerState.accumulatedMs + Math.max(0, Date.now() - timerState.lastStartedAt);
      }
      return timerState.accumulatedMs || 0;
    }

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        updateTimerDisplays();
      }, 500);
    }

    function updateTimerDisplays() {
      const pill = document.getElementById('header-timer-pill');
      const pillText = document.getElementById('header-timer-text');
      const elapsedSec = Math.floor(getTimerElapsedMs() / 1000);

      if (timerState.status === 'running' || timerState.status === 'paused') {
        pill.classList.remove('hidden');
        pill.classList.add('flex');
        if (timerState.mode === 'free') {
          pillText.textContent = formatTimerClock(elapsedSec);
        } else {
          const rem = Math.max(0, timerState.targetSec - elapsedSec);
          pillText.textContent = `${formatTimerClock(rem)} ${timerState.status === 'paused' ? '(停止)' : ''}`;
        }
      } else {
        pill.classList.add('hidden');
        pill.classList.remove('flex');
      }

      // Update main timer UI if visible
      const mainClock = document.getElementById('timer-main-clock');
      const mainSub = document.getElementById('timer-sub-clock');
      if (mainClock) {
        if (timerState.mode === 'free') {
          mainClock.textContent = formatTimerClock(elapsedSec);
          if (mainSub) mainSub.textContent = '自由計測（経過時間）';
        } else {
          const rem = timerState.targetSec - elapsedSec;
          if (rem >= 0) {
            mainClock.textContent = formatTimerClock(rem);
            if (mainSub) mainSub.textContent = `目標 ${Math.round(timerState.targetSec / 60)}分 ・ 経過 ${formatTimerClock(elapsedSec)}`;
          } else {
            mainClock.textContent = `+${formatTimerClock(Math.abs(rem))}`;
            if (mainSub) mainSub.textContent = `目標達成！超過時間を含めて計測中（合計 ${formatTimerClock(elapsedSec)}）`;
          }
        }
      }
    }

    function setTimerMode(mode) {
      if (timerState.status !== 'idle') {
        showToast('計測中はモードを変更できません', 'info');
        return;
      }
      timerState.mode = mode;
      timerState.targetSec = mode === '25' ? 25 * 60 : mode === '50' ? 50 * 60 : 0;
      persistTimer();
      renderView();
    }

    function startTimer() {
      if (timerState.status !== 'idle') {
        showToast('すでにタイマーが起動しています', 'info');
        return;
      }
      const catEl = document.getElementById('timer-category');
      const itemEl = document.getElementById('timer-item');
      const memoEl = document.getElementById('timer-memo');
      if (catEl) timerState.category = catEl.value;
      if (itemEl) timerState.item = itemEl.value;
      if (memoEl) timerState.memo = memoEl.value.trim();

      timerState.sessionId = genId('tsess');
      timerState.status = 'running';
      timerState.accumulatedMs = 0;
      timerState.lastStartedAt = Date.now();
      persistTimer();
      startTimerLoop();
      renderView();
      showToast('タイマーを開始しました', 'info');
    }

    function pauseTimer() {
      if (timerState.status !== 'running') return;
      timerState.accumulatedMs += Math.max(0, Date.now() - timerState.lastStartedAt);
      timerState.lastStartedAt = null;
      timerState.status = 'paused';
      persistTimer();
      renderView();
    }

    function resumeTimer() {
      if (timerState.status !== 'paused') return;
      timerState.lastStartedAt = Date.now();
      timerState.status = 'running';
      persistTimer();
      startTimerLoop();
      renderView();
    }

    function finishTimerAndSave() {
      if (isSavingLock) return;
      if (timerState.status === 'idle' || !timerState.sessionId) return;

      // Prevent duplicate save for same sessionId
      if (appData.activities.some(a => a.timerSessionId === timerState.sessionId)) {
        resetTimerState();
        renderView();
        return;
      }

      isSavingLock = true;
      const elapsedMs = getTimerElapsedMs();
      const elapsedSec = Math.floor(elapsedMs / 1000);
      const memoEl = document.getElementById('timer-memo');
      const memo = memoEl ? memoEl.value.trim() : timerState.memo;

      const minutes = Math.max(1, Math.round(elapsedSec / 60));
      const today = toLocalDateStr();

      appData.activities.unshift({
        id: genId('act'),
        timerSessionId: timerState.sessionId,
        date: today,
        startTime: '',
        category: timerState.category,
        item: timerState.item,
        minutes: minutes,
        exactSeconds: elapsedSec,
        precision: 'measured',
        memo: memo,
        isDemo: false,
        createdAt: new Date().toISOString()
      });

      persistData();
      resetTimerState();
      isSavingLock = false;
      renderView();
      showToast(`${timerState.item || CATEGORY_META[timerState.category].jp} を ${minutes}分（実測）で保存しました`);
    }

    function confirmDiscardTimer() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-lg font-semibold">タイマーを破棄しますか？</h3>
          <p class="text-sm" style="color: var(--text-secondary)">現在計測中の時間は記録されずにリセットされます。</p>
          <div class="flex gap-3 pt-2">
            <button class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
            <button class="btn-tap flex-1 bg-rose-600 text-white text-sm" onclick="resetTimerState(); closeModal(); renderView(); showToast('タイマーをリセットしました', 'info');">破棄する</button>
          </div>
        </div>
      `);
    }

    function resetTimerState() {
      const prevCat = timerState.category;
      const prevItem = timerState.item;
      const prevMode = timerState.mode;
      timerState = getDefaultTimer();
      timerState.category = prevCat;
      timerState.item = prevItem;
      timerState.mode = prevMode;
      timerState.targetSec = prevMode === '25' ? 25 * 60 : prevMode === '50' ? 50 * 60 : 0;
      persistTimer();
      updateTimerDisplays();
    }

    // ==========================================
    // 6. DATA COMPUTATION HELPERS
    // ==========================================
    function getLatestWeightInfo() {
      if (appData.weights.length === 0) {
        return {
          weightKg: appData.settings.startWeightKg,
          isInitial: true,
          date: null,
          bodyFatPct: null
        };
      }
      const sorted = [...appData.weights].sort((a, b) => b.measuredAt.localeCompare(a.measuredAt));
      return {
        weightKg: sorted[0].weightKg,
        isInitial: false,
        date: sorted[0].date,
        measuredAt: sorted[0].measuredAt,
        bodyFatPct: sorted[0].bodyFatPct
      };
    }

    function getWeightMovingAverage(days) {
      const today = toLocalDateStr();
      const cutoff = addDays(today, -(days - 1));
      const inRange = appData.weights.filter(w => w.date >= cutoff && w.date <= today);
      if (inRange.length === 0) return null;
      const sum = inRange.reduce((acc, w) => acc + Number(w.weightKg), 0);
      return {
        avg: +(sum / inRange.length).toFixed(1),
        count: inRange.length
      };
    }

    function calcBMI(weightKg, heightCm) {
      if (!heightCm || heightCm <= 0) return null;
      const hm = heightCm / 100;
      return +(weightKg / (hm * hm)).toFixed(1);
    }

    function getDayCategoryMinutes(dateStr, categoryFilterFn, precisionFilter = 'all') {
      const matching = appData.activities.filter(a => {
        if (a.date !== dateStr) return false;
        if (!categoryFilterFn(a)) return false;
        if (a.precision === 'unconfirmed') return false; // Never mix unconfirmed into totals
        if (precisionFilter !== 'all' && a.precision !== precisionFilter) return false;
        return true;
      });
      if (matching.length === 0) return null; // Return null so UI shows "未記録" rather than 0
      return matching.reduce((s, a) => s + Number(a.minutes || 0), 0);
    }

    function getTodayHabitSummary(dateStr = toLocalDateStr()) {
      const activeHabits = appData.habits.filter(h => h.active);
      const dayLog = appData.habitLogs[dateStr] || {};
      const completed = activeHabits.filter(h => dayLog[h.id]).length;
      return { completed, total: activeHabits.length, activeHabits, dayLog };
    }

    function isCategoryConfirmedRest(dateStr, cat) {
      const entry = appData.confirmedRestDays[dateStr];
      if (!entry) return false;
      if (entry.all) return true;
      return Array.isArray(entry.categories) && entry.categories.includes(cat);
    }

      renderView();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      chartInstances = {};

    function submitManualLog(e) {
      e.preventDefault();
      if (isSavingLock) return;
      isSavingLock = true;

      const cat = window._manualCat || 'STUDY';
      const item = document.getElementById('manual-item').value;
      const date = document.getElementById('manual-date').value;
      const minutes = parseInt(document.getElementById('manual-minutes').value, 10);

      const startTime = document.getElementById('manual-start-time').value;
      const memo = document.getElementById('manual-memo').value.trim();

      if (!date || isNaN(minutes) || minutes <= 0) {
        isSavingLock = false;
        showToast('日付と正しい時間を入力してください', 'error');
        return;
      }

      appData.activities.unshift({
        id: genId('act'),

        category: cat,
        item,
        minutes,
        precision,
        memo,
        isDemo: false,
        createdAt: new Date().toISOString()

      persistData();
      isSavingLock = false;
      renderView();
      showToast(`${item}（${minutes}分・${PRECISION_META[precision].label}）を記録しました`);
    }

    function stepWeightInput(delta) {
      const el = document.getElementById('weight-input-kg');
      if (!el) return;
      const val = parseFloat(el.value) || appData.settings.startWeightKg;
      el.value = Math.max(20, Math.min(300, val + delta)).toFixed(1);
    }

    function submitWeightForm(e) {
      e.preventDefault();
      const kg = parseFloat(document.getElementById('weight-input-kg').value);
      const fatVal = document.getElementById('weight-input-fat').value;
      const sleepVal = document.getElementById('weight-input-sleep').value;
      const dt = document.getElementById('weight-input-dt').value || toLocalDateTimeStr();
      const note = document.getElementById('weight-input-note').value.trim();

      if (isNaN(kg) || kg < 20 || kg > 300) {
        showToast('正しい体重を入力してください', 'error');
        return;
      }

      appData.weights.unshift({
        id: genId('wt'),
        date: dt.slice(0, 10),
        measuredAt: dt,
        weightKg: +kg.toFixed(1),
        bodyFatPct: fatVal ? +parseFloat(fatVal).toFixed(1) : null,
        sleepHours: sleepVal ? +parseFloat(sleepVal).toFixed(1) : null,
        note,
        isDemo: false,
        createdAt: new Date().toISOString()
      });
      persistData();
      renderView();
      showToast(`体重 ${kg.toFixed(1)}kg を保存しました`);
    }

    // ==========================================
    // 10. SCREEN ③ ANALYTICS
    // ==========================================
    function getAnalyticsRange() {
      const today = toLocalDateStr();
      if (analyticsPeriod === 'week') return { start: addDays(today, -6), end: today, label: '直近7日間' };
      if (analyticsPeriod === 'month') return { start: addDays(today, -29), end: today, label: '直近30日間' };
      if (analyticsPeriod === 'quarter') return { start: addDays(today, -89), end: today, label: '直近3か月' };
      if (analyticsPeriod === 'year') return { start: addDays(today, -364), end: today, label: '直近1年間' };
      return {
        start: analyticsCustomStart <= analyticsCustomEnd ? analyticsCustomStart : analyticsCustomEnd,
        end: analyticsCustomStart <= analyticsCustomEnd ? analyticsCustomEnd : analyticsCustomStart,
        label: '指定期間'
      };
    }

    function renderAnalytics(container) {
      const range = getAnalyticsRange();
      const allInPeriod = appData.activities.filter(a => a.date >= range.start && a.date <= range.end);
      const unconfirmedList = allInPeriod.filter(a => a.precision === 'unconfirmed');
      const validActs = allInPeriod.filter(a => {
        if (a.precision === 'unconfirmed') return false;
        if (analyticsPrecisionFilter !== 'all' && a.precision !== analyticsPrecisionFilter) return false;
        return true;
      });

      const weightsInPeriod = appData.weights
        .filter(w => w.date >= range.start && w.date <= range.end)
        .sort((a, b) => a.measuredAt.localeCompare(b.measuredAt));

      const studyActs = validActs.filter(a => a.category === 'STUDY');
      const exActs = validActs.filter(a => a.category === 'BODY' && a.item === '運動');
      const readActs = validActs.filter(a => a.category === 'KNOWLEDGE');
      const aiActs = validActs.filter(a => a.category === 'CREATE');

      const sumMins = arr => arr.reduce((s, a) => s + Number(a.minutes || 0), 0);
      const totalStudy = sumMins(studyActs);
      const totalEx = sumMins(exActs);
      const totalRead = sumMins(readActs);
      const totalAi = sumMins(aiActs);

      // Precision breakdown for Study
      const byPrec = {
        measured: sumMins(validActs.filter(a => a.precision === 'measured')),
        manual: sumMins(validActs.filter(a => a.precision === 'manual')),
        approx: sumMins(validActs.filter(a => a.precision === 'approx'))
      };

      // Habit stats in period (only dates that have habitLogs)
      const activeHabits = appData.habits.filter(h => h.active);
      const loggedHabitDates = Object.keys(appData.habitLogs).filter(d => d >= range.start && d <= range.end);
      let habitRateStr = '記録なし';
      if (loggedHabitDates.length > 0 && activeHabits.length > 0) {
        let checked = 0;
        let possible = loggedHabitDates.length * activeHabits.length;
        loggedHabitDates.forEach(d => {
          activeHabits.forEach(h => {
            if (appData.habitLogs[d]?.[h.id]) checked++;
          });
        });
        habitRateStr = `${Math.round((checked / possible) * 100)}% (${loggedHabitDates.length}日分)`;
      }

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h1 class="text-xl font-semibold">分析・進捗</h1>
              <p class="text-xs" style="color: var(--text-muted)">${range.start} 〜 ${range.end}（記録のない日は推測・補完しません）</p>
            </div>
          </div>

          <!-- Period & Precision Controls -->
          <div class="card p-4 space-y-3">
            <div class="flex flex-wrap gap-1.5">
              ${[
                { id: 'week', label: '週間' },
                { id: 'month', label: '月間' },
                { id: 'quarter', label: '3か月' },
                { id: 'year', label: '年間' },
                { id: 'custom', label: '期間指定' }
              ].map(p => `
                <button class="px-3 py-1.5 rounded-xl text-xs font-medium ${analyticsPeriod === p.id ? 'bg-blue-600 text-white' : 'card-elevated'}" onclick="analyticsPeriod='${p.id}'; renderView();">
                  ${p.label}
                </button>
              `).join('')}
            </div>

            ${analyticsPeriod === 'custom' ? `
              <div class="flex flex-wrap items-center gap-2 pt-1">
                <input type="date" class="input-base w-auto text-xs" value="${analyticsCustomStart}" onchange="analyticsCustomStart=this.value; renderView();" />
                <span class="text-xs">〜</span>
                <input type="date" class="input-base w-auto text-xs" value="${analyticsCustomEnd}" onchange="analyticsCustomEnd=this.value; renderView();" />
              </div>
            ` : ''}

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t" style="border-color: var(--border-subtle)">
              <div class="flex flex-wrap gap-1.5 pt-2">
                ${[
                  { id: 'all', label: 'すべて(実測+手入力+概算)' },
                  { id: 'measured', label: '実測のみ' },
                  { id: 'manual', label: '手入力のみ' },
                  { id: 'approx', label: '概算のみ' }
                ].map(f => `
                  <button class="px-2.5 py-1 rounded-lg text-[11px] font-medium ${analyticsPrecisionFilter === f.id ? 'bg-emerald-600 text-white' : 'card-elevated'}" onclick="analyticsPrecisionFilter='${f.id}'; renderView();">
                    ${f.label}
                  </button>
                `).join('')}
              </div>
              ${unconfirmedList.length > 0 ? `
                <span class="text-[11px] px-2.5 py-1 rounded-lg bg-zinc-700/40 text-zinc-300 mt-2">
                  未確認 ${unconfirmedList.length}件（集計除外中）
                </span>
              ` : ''}
            </div>
          </div>

          <!-- Summary KPI Cards -->
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">勉強時間</div>
              <div class="text-lg font-semibold tabular-nums mt-0.5">${studyActs.length ? formatMinutes(totalStudy) : '記録なし'}</div>
            </div>
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">運動時間 / 回数</div>
              <div class="text-lg font-semibold tabular-nums mt-0.5">${exActs.length ? `${formatMinutes(totalEx)} (${exActs.length}回)` : '記録なし'}</div>
            </div>
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">読書・学習</div>
              <div class="text-lg font-semibold tabular-nums mt-0.5">${readActs.length ? formatMinutes(totalRead) : '記録なし'}</div>
            </div>
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">AI・制作時間</div>
              <div class="text-lg font-semibold tabular-nums mt-0.5">${aiActs.length ? formatMinutes(totalAi) : '記録なし'}</div>
            </div>
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">精度内訳(全活動)</div>
              <div class="text-xs tabular-nums mt-1 space-y-0.5" style="color: var(--text-secondary)">
                <div>実測: ${formatMinutes(byPrec.measured)}</div>
                <div>手/概: ${formatMinutes(byPrec.manual + byPrec.approx)}</div>
              </div>
            </div>
            <div class="card p-3.5">
              <div class="text-[11px]" style="color: var(--text-muted)">習慣達成率</div>
              <div class="text-base font-semibold tabular-nums mt-0.5">${habitRateStr}</div>
            </div>
          </div>

          <!-- Charts Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Study & Activity Stacked by Precision -->
            <div class="card p-5 space-y-3">
              <h3 class="text-sm font-semibold">活動時間の推移（実測 / 手入力 / 概算 別）</h3>
              ${validActs.length === 0 ? `<div class="h-64 flex items-center justify-center text-xs" style="color: var(--text-muted)">この期間の活動記録はまだありません</div>` : `
                <div class="relative h-64">
                  <canvas id="chart-activity-precision"></canvas>
                </div>
              `}
            </div>

            <!-- Weight Trend Chart -->
            <div class="card p-5 space-y-3">
              <h3 class="text-sm font-semibold">体重推移（測定日のみ・補完なし）</h3>
              ${weightsInPeriod.length === 0 ? `<div class="h-64 flex items-center justify-center text-xs" style="color: var(--text-muted)">この期間の体重記録はまだありません</div>` : `
                <div class="relative h-64">
                  <canvas id="chart-weight-trend"></canvas>
                </div>
              `}
            </div>

            <!-- Study by Subject -->
            <div class="card p-5 space-y-3">
              <h3 class="text-sm font-semibold">科目別 勉強時間</h3>
              ${studyActs.length === 0 ? `<div class="h-64 flex items-center justify-center text-xs" style="color: var(--text-muted)">この期間の勉強記録はまだありません</div>` : `
                <div class="relative h-64">
                  <canvas id="chart-study-subjects"></canvas>
                </div>
              `}
            </div>

            <!-- Category Breakdown -->

              <h3 class="text-sm font-semibold">カテゴリー別 時間配分</h3>

                <div class="relative h-64">
                  <canvas id="chart-categories"></canvas>
                </div>
              `}
            </div>
          </div>
        </div>
      `;

      // Render charts if data exists
      setTimeout(() => {
        if (validActs.length > 0) {
          buildActivityPrecisionChart(validActs, range);
          buildCategoryChart(validActs);
        }
        if (studyActs.length > 0) {
          buildSubjectChart(studyActs);
        }
        if (weightsInPeriod.length > 0) {
          buildWeightChart(weightsInPeriod);
        }
      }, 0);

    function buildActivityPrecisionChart(acts, range) {
      const canvas = document.getElementById('chart-activity-precision');
      if (!canvas) return;
      // Group by recorded dates (sorted)
      const dateSet = Array.from(new Set(acts.map(a => a.date))).sort();
      const measuredData = dateSet.map(d => acts.filter(a => a.date === d && a.precision === 'measured').reduce((s, a) => s + a.minutes, 0));
      const manualData = dateSet.map(d => acts.filter(a => a.date === d && a.precision === 'manual').reduce((s, a) => s + a.minutes, 0));
      const approxData = dateSet.map(d => acts.filter(a => a.date === d && a.precision === 'approx').reduce((s, a) => s + a.minutes, 0));

      chartInstances.actPrec = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: dateSet.map(d => d.slice(5)),
          datasets: [
            { label: '実測', data: measuredData, backgroundColor: '#3b82f6', borderRadius: 4 },
            { label: '手入力', data: manualData, backgroundColor: '#10b981', borderRadius: 4 },
            { label: '概算', data: approxData, backgroundColor: '#f59e0b', borderRadius: 4 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { stacked: true, ticks: { color: '#a1a1aa', font: { size: 11 } }, grid: { display: false } },
            y: { stacked: true, ticks: { color: '#a1a1aa', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
          },
          plugins: {
            legend: { labels: { color: '#d4d4d8', boxWidth: 12, font: { size: 11 } } }
          }
        }
      });
    }

    function buildWeightChart(weights) {
      const canvas = document.getElementById('chart-weight-trend');
      if (!canvas) return;
      const labels = weights.map(w => w.date.slice(5));
      const values = weights.map(w => w.weightKg);
      const targetLine = weights.map(() => appData.settings.targetWeightKg);

      chartInstances.weight = new Chart(canvas, {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: '測定体重 (kg)',
              data: values,
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.12)',
              tension: 0.2,
              pointRadius: 4,
              fill: true
            },
            {
              label: '目標体重 (kg)',
              data: targetLine,
              borderColor: 'rgba(245, 158, 11, 0.7)',
              borderDash: [5, 5],
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: '#a1a1aa', font: { size: 11 } }, grid: { display: false } },
            y: { ticks: { color: '#a1a1aa', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } }
          },
          plugins: {
            legend: { labels: { color: '#d4d4d8', boxWidth: 12, font: { size: 11 } } }
          }
        }
      });
    }

    function buildSubjectChart(studyActs) {
      const canvas = document.getElementById('chart-study-subjects');
      if (!canvas) return;
      const map = {};
      studyActs.forEach(a => {
        map[a.item] = (map[a.item] || 0) + a.minutes;
      });
      const labels = Object.keys(map);
      const data = Object.values(map);
      const palette = ['#3b82f6', '#06b6d4', '#8b5cf6', '#10b981', '#f59e0b', '#ec4899', '#64748b'];

      chartInstances.subject = new Chart(canvas, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '勉強時間 (分)',
            data,
            backgroundColor: labels.map((_, i) => palette[i % palette.length]),
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { ticks: { color: '#a1a1aa', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.06)' } },
            y: { ticks: { color: '#d4d4d8', font: { size: 11 } }, grid: { display: false } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    function buildCategoryChart(acts) {
      const canvas = document.getElementById('chart-categories');
      if (!canvas) return;
      const map = {};
      acts.forEach(a => {
        map[a.category] = (map[a.category] || 0) + a.minutes;
      });
      const keys = Object.keys(map);
      chartInstances.cat = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: keys.map(k => CATEGORY_META[k]?.jp || k),
          datasets: [{
            data: keys.map(k => map[k]),
            backgroundColor: keys.map(k => CATEGORY_META[k]?.color || '#71717a'),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '62%',
          plugins: {
            legend: { position: 'right', labels: { color: '#d4d4d8', boxWidth: 12, font: { size: 11 } } }
          }
        }
      });
    }

    // 11. SCREEN ④ CALENDAR
    // ==========================================

      const month = calendarMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const startDow = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startDow; i++) cells.push(null);

      const selWeights = appData.weights.filter(w => w.date === selectedCalendarDate);

      container.innerHTML = `

            </div>

              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>運動</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span>体重</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-violet-500"></span>読書</span>
              <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-500"></span>AI開発</span>

            </div>

            <!-- Weekdays -->
            <div class="grid grid-cols-7 text-center text-[11px] font-medium" style="color: var(--text-muted)">
              <div class="text-rose-400">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-400">土</div>
            </div>

            <!-- Days Grid -->
            <div class="grid grid-cols-7 gap-1 sm:gap-1.5">
              ${cells.map(dateStr => {
                if (!dateStr) return `<div class="h-14 sm:h-16"></div>`;

                const isSel = dateStr === selectedCalendarDate;
                const isToday = dateStr === today;
                const dActs = appData.activities.filter(a => a.date === dateStr);
                const dW = appData.weights.some(w => w.date === dateStr);

                const isRest = Boolean(appData.confirmedRestDays[dateStr]?.all);

                const dots = [];
                if (dActs.some(a => a.category === 'STUDY')) dots.push('#3b82f6');
                if (dActs.some(a => a.category === 'BODY' && a.item === '運動')) dots.push('#10b981');

                if (dActs.some(a => a.category === 'KNOWLEDGE')) dots.push('#8b5cf6');
                if (dActs.some(a => a.category === 'CREATE')) dots.push('#06b6d4');
                if (dHabit) dots.push('#f43f5e');

                return `
                  <button class="h-14 sm:h-16 rounded-xl p-1.5 flex flex-col items-center justify-between transition-all ${isSel ? 'bg-blue-600/20 ring-1 ring-blue-500' : 'card-elevated'} ${isToday && !isSel ? 'ring-1 ring-zinc-500' : ''}" onclick="selectedCalendarDate='${dateStr}'; renderView();">

      e.preventDefault();

      appData.settings.targetWeightKg = parseFloat(document.getElementById('set-target-w').value) || 75.0;
      persistData();
      showToast('身長・目標体重を保存しました');

    // ==========================================
    // 13. SHARED ACTIVITY LIST & MODALS

    function renderActivityList(list) {
      if (!list || list.length === 0) {
        return `<p class="text-xs py-2" style="color: var(--text-muted)">記録はありません</p>`;
      }
      return `
        <div class="space-y-2">
          ${list.map(a => {
            const cat = CATEGORY_META[a.category] || CATEGORY_META.OTHER;
            const prec = PRECISION_META[a.precision] || PRECISION_META.approx;
            return `
              <div class="p-3 rounded-xl card-elevated flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-1.5">
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md" style="background:${cat.bg}; color:${cat.color}">${cat.jp}</span>
                    <span class="text-sm font-medium truncate">${escHtml(a.item)}</span>
                    <span class="text-sm font-semibold tabular-nums">${a.minutes}分</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-md" style="background:${prec.bg}; color:${prec.color}">${prec.label}</span>
                    ${a.isDemo ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400">DEMO</span>` : ''}
                  </div>
                  <div class="text-[11px] mt-0.5 truncate" style="color: var(--text-muted)">
                    ${a.date} ${a.startTime ? a.startTime : ''} ${a.memo ? `・ ${escHtml(a.memo)}` : ''}

                <div class="flex items-center gap-1 shrink-0">
                  <button class="p-2 rounded-lg hover:bg-white/5 text-zinc-400" onclick="openEditActivityModal('${a.id}')" title="編集">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                  </button>
                  <button class="p-2 rounded-lg hover:bg-rose-500/10 text-rose-400" onclick="confirmDeleteActivity('${a.id}')" title="削除">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

        isDemo: false,
        createdAt: new Date().toISOString()

      closeModal();

      showToast(`体重 ${kg.toFixed(1)}kg を記録しました`);

      openModal(`

          <div class="flex items-center justify-between">
            <h3 class="text-base font-semibold">記録を編集</h3>

      act.date = document.getElementById('ea-date').value;
      act.item = document.getElementById('ea-item').value.trim();
      act.minutes = parseInt(document.getElementById('ea-min').value, 10);
      act.precision = document.getElementById('ea-prec').value;
      act.memo = document.getElementById('ea-memo').value.trim();
      persistData();
      closeModal();
      renderView();
      showToast('記録を更新しました');
    }

          <div class="flex items-center justify-between">
            <h3 class="text-base font-semibold">体重記録を編集</h3>
            <button onclick="closeModal()" class="text-zinc-400"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <form class="space-y-3" onsubmit="saveEditedWeight(event, '${id}')">
            <input id="ew-kg" type="number" step="0.1" class="input-base tabular-nums" value="${w.weightKg}" required />
            <input id="ew-dt" type="datetime-local" class="input-base" value="${w.measuredAt.slice(0,16)}" required />
            <input id="ew-note" type="text" class="input-base" value="${escHtml(w.note || '')}" placeholder="メモ" />
            <button type="submit" class="btn-tap w-full bg-emerald-600 text-white font-semibold py-3">更新する</button>
          </form>
        </div>
      `);
    }

    function saveEditedWeight(e, id) {
      e.preventDefault();
      const w = appData.weights.find(x => x.id === id);
      if (!w) return;
      w.weightKg = +parseFloat(document.getElementById('ew-kg').value).toFixed(1);
      w.measuredAt = document.getElementById('ew-dt').value;
      w.date = w.measuredAt.slice(0, 10);
      w.note = document.getElementById('ew-note').value.trim();
      persistData();
      closeModal();
      renderView();
      showToast('体重記録を更新しました');
    }

    function confirmDeleteWeight(id) {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-semibold">この体重記録を削除しますか？</h3>
          <div class="flex gap-3">
            <button class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
            <button class="btn-tap flex-1 bg-rose-600 text-white text-sm" onclick="appData.weights=appData.weights.filter(w=>w.id!=='${id}'); persistData(); closeModal(); renderView(); showToast('削除しました', 'info');">削除</button>
          </div>
        </div>
      `);
    }

    function openQuickAddItemModal(cat) {
      openAddCustomTagModal(cat);
    }

    function openAddCustomTagModal(type) {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-semibold">新しい項目を追加</h3>
          <form class="space-y-3" onsubmit="submitCustomTag(event, '${type}')">
            <input id="new-tag-name" type="text" class="input-base" placeholder="項目名を入力" required autofocus />
            <div class="flex gap-2">
              <button type="button" class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
              <button type="submit" class="btn-tap flex-1 bg-blue-600 text-white text-sm">追加</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitCustomTag(e, type) {
      e.preventDefault();
      const val = document.getElementById('new-tag-name').value.trim();
      if (!val) return;
      if (type === 'EXERCISE') {
        if (!appData.exerciseMenu.includes(val)) appData.exerciseMenu.push(val);
      } else {
        if (!appData.categories[type].includes(val)) appData.categories[type].push(val);
      }
      persistData();
      closeModal();
      renderView();
      showToast(`「${val}」を追加しました`);
    }

    function removeCustomTag(type, idx) {
      if (type === 'EXERCISE') appData.exerciseMenu.splice(idx, 1);
      else appData.categories[type].splice(idx, 1);
      persistData();
      renderView();
    }

    function openAddHabitModal() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-semibold">新しい習慣を追加</h3>
          <form class="space-y-3" onsubmit="submitNewHabit(event)">
            <input id="new-habit-name" type="text" class="input-base" placeholder="例: 毎日英単語10個" required autofocus />
            <div class="flex gap-2">
              <button type="button" class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
              <button type="submit" class="btn-tap flex-1 bg-blue-600 text-white text-sm">追加</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitNewHabit(e) {
      e.preventDefault();
      const name = document.getElementById('new-habit-name').value.trim();
      if (!name) return;
      appData.habits.push({ id: genId('hab'), name, active: true });
      persistData();
      closeModal();
      renderView();
      showToast(`習慣「${name}」を追加しました`);
    }

    function removeHabit(idx) {
      appData.habits.splice(idx, 1);
      persistData();
      renderView();
    }

    // ==========================================
    // 14. EXPORT, BACKUP, RESTORE, DEMO & WIPE
    // ==========================================
    function exportCSV() {
      const lines = ['種別,日付,時刻,カテゴリー,項目,時間(分),精度,体重(kg),体脂肪率(%),メモ'];
      appData.activities.forEach(a => {
        lines.push([
          '活動', a.date, a.startTime || '', a.category, a.item, a.minutes,
          PRECISION_META[a.precision]?.label || a.precision, '', '',
          `"${(a.memo || '').replace(/"/g, '""')}"`
        ].join(','));
      });
      appData.weights.forEach(w => {
        lines.push([
          '体重', w.date, w.measuredAt.slice(11, 16), 'BODY', '体重測定', '', '実測',
          w.weightKg, w.bodyFatPct || '',
          `"${(w.note || '').replace(/"/g, '""')}"`
        ].join(','));
      });
      const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      downloadBlob(blob, `lifelog_export_${toLocalDateStr()}.csv`);
      showToast('CSVファイルを出力しました');
    }

    function exportJSONBackup() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      downloadBlob(blob, `lifelog_backup_${toLocalDateStr()}.json`);
      showToast('JSONバックアップを保存しました');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function importJSONBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.activities) || !Array.isArray(parsed.weights)) {
            showToast('LIFELOGのバックアップ形式ではありません', 'error');
            return;
          }
          openModal(`
            <div class="space-y-4">
              <h3 class="text-base font-semibold">バックアップを復元しますか？</h3>
              <p class="text-xs" style="color: var(--text-secondary)">現在のデータは上書きされます。（活動 ${parsed.activities.length}件・体重 ${parsed.weights.length}件）</p>
              <div class="flex gap-2">
                <button class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
                <button class="btn-tap flex-1 bg-amber-600 text-white text-sm" onclick="applyRestoredData()">復元する</button>
              </div>
            </div>
          `);
          window._pendingRestore = parsed;
        } catch (err) {
          showToast('JSONの読み込みに失敗しました', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function applyRestoredData() {
      if (!window._pendingRestore) return;
      appData = Object.assign(getDefaultData(), window._pendingRestore);
      window._pendingRestore = null;
      persistData();
      applyTheme();
      closeModal();
      renderView();
      showToast('バックアップからデータを復元しました');
    }

    function confirmWipeAllData() {
      openModal(`
        <div class="space-y-4">
          <h3 class="text-base font-semibold text-rose-400">全データを削除しますか？</h3>
          <p class="text-xs" style="color: var(--text-secondary)">すべての記録・体重履歴・カスタム項目が完全に削除されます。この操作は取り消せません。</p>
          <input id="wipe-confirm-input" type="text" class="input-base text-sm" placeholder="確認のため DELETE と入力" />
          <div class="flex gap-2">
            <button class="btn-tap flex-1 card-elevated text-sm" onclick="closeModal()">キャンセル</button>
            <button class="btn-tap flex-1 bg-rose-600 text-white text-sm" onclick="executeWipeAllData()">完全削除</button>
          </div>
        </div>
      `);
    }

    function executeWipeAllData() {
      const val = document.getElementById('wipe-confirm-input')?.value.trim();
      if (val !== 'DELETE') {
        showToast('確認文字 DELETE を入力してください', 'error');
        return;
      }
      appData = getDefaultData();
      resetTimerState();
      persistData();
      applyTheme();
      closeModal();
      renderView();
      showToast('全データを削除しました', 'info');
    }

    function toggleDemoData() {
      const hasDemo = appData.activities.some(a => a.isDemo) || appData.weights.some(w => w.isDemo);
      if (hasDemo) {
        appData.activities = appData.activities.filter(a => !a.isDemo);
        appData.weights = appData.weights.filter(w => !w.isDemo);
        persistData();
        renderView();
        showToast('DEMOデータを消去しました', 'info');
        return;
      }

      const today = toLocalDateStr();
      const demoActs = [
        { date: addDays(today, -5), category: 'STUDY', item: '英語', minutes: 45, precision: 'measured', memo: 'リスニング・単語' },
        { date: addDays(today, -5), category: 'BODY', item: '運動', minutes: 25, precision: 'approx', memo: '[ウォーキング]' },
        { date: addDays(today, -4), category: 'CREATE', item: 'AI開発', minutes: 60, precision: 'measured', memo: 'プロンプト設計' },
        { date: addDays(today, -3), category: 'STUDY', item: '数学', minutes: 50, precision: 'measured', memo: '微積演習' },
        { date: addDays(today, -3), category: 'KNOWLEDGE', item: '読書', minutes: 20, precision: 'approx', memo: '技術書' },
        { date: addDays(today, -2), category: 'BODY', item: '運動', minutes: 30, precision: 'manual', memo: '[筋トレ: 15回 / 3セット]' },
        { date: addDays(today, -1), category: 'STUDY', item: '情報', minutes: 35, precision: 'approx', memo: '後から概算で記録' }
      ].map(x => ({
        id: genId('demo_a'),
        startTime: '',
        isDemo: true,
        createdAt: new Date().toISOString(),
        ...x
      }));

      const demoWeights = [
        { date: addDays(today, -6), weightKg: 85.4 },
        { date: addDays(today, -4), weightKg: 85.1 },
        { date: addDays(today, -2), weightKg: 84.9 },
        { date: addDays(today, -1), weightKg: 84.8 }
      ].map(w => ({
        id: genId('demo_w'),
        measuredAt: `${w.date}T07:30`,
        bodyFatPct: null,
        sleepHours: null,
        note: '朝の測定',
        isDemo: true,
        createdAt: new Date().toISOString(),
        ...w
      }));

      appData.activities.push(...demoActs);
      appData.weights.push(...demoWeights);
      persistData();
      renderView();
      showToast('DEMO用サンプルデータを読み込みました（バッジで区別表示）');
    }

    function copyAISummaryPrompt() {
      const today = toLocalDateStr();
      const start = addDays(today, -6);
      const acts = appData.activities.filter(a => a.date >= start && a.date <= today && a.precision !== 'unconfirmed');
      const wLatest = getLatestWeightInfo();
      const summary = [
        `【LIFELOG 直近7日間サマリー (${start} 〜 ${today})】`,
        `現在体重: ${wLatest.weightKg}kg (目標: ${appData.settings.targetWeightKg}kg)`,
        `記録件数: ${acts.length}件`,
        ...acts.map(a => `- ${a.date} [${CATEGORY_META[a.category]?.jp}] ${a.item} ${a.minutes}分 (${PRECISION_META[a.precision]?.label}) ${a.memo || ''}`),
        `\nこの記録をもとに、良い点・勉強と運動のバランス・無理のない来週の目標を提案してください。`
      ].join('\n');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(summary).then(() => {
          showToast('AI相談用サマリーをコピーしました');
        }).catch(() => fallbackCopy(summary));
      } else {
        fallbackCopy(summary);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('AI相談用サマリーをコピーしました');
      } catch (e) {
        showToast('コピーに失敗しました', 'error');
      }
      ta.remove();
    }

    // Future AI Adapter Hook (Unconnected by default)
    window.LIFELOG_AI_ADAPTER = {
      connected: false,
      provider: null,
      capabilities: ['weekly_review', 'monthly_review', 'balance_analysis', 'weight_explanation', 'habit_suggestions', 'next_week_goal', 'natural_language_logging']
    };

    // ==========================================
    // 15. INITIALIZATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      updateDemoBadge();
      if (timerState.status === 'running' || timerState.status === 'paused') {
        startTimerLoop();
      }
      switchTab('home');
    });
  </script>
</body>
